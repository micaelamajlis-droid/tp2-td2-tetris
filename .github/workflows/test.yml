name: Tests TP2

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev valgrind pkg-config
      - name: Compilar
        run: make
      - name: make test
        run: make test
      - name: make valgrind
        run: make valgrind
